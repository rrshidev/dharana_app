name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

# ВАЖНО: артефакт CI подписан СВЕЖИМ debug-keystore, сгенерированным на раннере.
# Его отпечатки НЕ совпадают с опубликованными:
#   - assetlinks.json (https://dharana.ru/.well-known/assetlinks.json, SHA-256 CA:15:BD:...)
#   - Android OAuth-клиент Google (SHA-1 AD:7D:54:...)
# Поэтому APK из артефакта годится для QA, но НЕ для замены https://dharana.ru/download/dharana.apk.
# Публичную сборку делаем локально: .\build_apk.ps1 (стабильный developer-keystore,
# та же строка API_BASE_URL + проверка, что хост реально вшит в APK).
#
# Client ID Яндекс/VK лежат в переменных репозитория (Settings -> Secrets and
# variables -> Actions -> Variables): YANDEX_CLIENT_ID, VK_CLIENT_ID. Без них
# экран входа собирается БЕЗ кнопок этих провайдеров (случай 2026-10-05), поэтому
# шаг ниже валит сборку, если переменных нет.

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check OAuth client ids are configured
        env:
          YANDEX_CLIENT_ID: ${{ vars.YANDEX_CLIENT_ID }}
          VK_CLIENT_ID: ${{ vars.VK_CLIENT_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${YANDEX_CLIENT_ID}" ] || missing="${missing} YANDEX_CLIENT_ID"
          [ -n "${VK_CLIENT_ID}" ] || missing="${missing} VK_CLIENT_ID"
          if [ -n "${missing}" ]; then
            echo "::error::Не заданы переменные репозитория:${missing}. Без них в APK не будет кнопок входа."
            exit 1
          fi

      # Строка API_BASE_URL обязана попасть в libapp.so: без неё приложение
      # ходит на http://localhost:8000 (дефолт String.fromEnvironment) и на
      # реальном телефоне не работает. Ловим это на сборке, а не на проде.
      # Client ID проверяются так же: пустой dart-define = нет кнопки входа.
      - name: Build release APK
        env:
          YANDEX_CLIENT_ID: ${{ vars.YANDEX_CLIENT_ID }}
          VK_CLIENT_ID: ${{ vars.VK_CLIENT_ID }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=GOOGLE_WEB_CLIENT_ID=914006620256-t7uqhvlqqlikgesrl59cghv3d1l93gft.apps.googleusercontent.com \
            --dart-define=API_BASE_URL=https://api.dharana.ru \
            --dart-define=SITE_BASE_URL=https://dharana.ru \
            --dart-define=YANDEX_CLIENT_ID="$YANDEX_CLIENT_ID" \
            --dart-define=VK_CLIENT_ID="$VK_CLIENT_ID"

      - name: Verify defines inside APK
        env:
          YANDEX_CLIENT_ID: ${{ vars.YANDEX_CLIENT_ID }}
          VK_CLIENT_ID: ${{ vars.VK_CLIENT_ID }}
        run: |
          set -euo pipefail
          unzip -p build/app/outputs/flutter-apk/app-release.apk lib/arm64-v8a/libapp.so > /tmp/libapp.so
          for value in api.dharana.ru dharana.ru "$YANDEX_CLIENT_ID" "$VK_CLIENT_ID"; do
            if grep -qa "$value" /tmp/libapp.so; then
              echo "OK: $value"
            else
              echo "::error::В APK нет '$value' — сборка не готова к публикации"
              exit 1
            fi
          done

      - name: Upload APK artifact (QA only, другой ключ подписи)
        uses: actions/upload-artifact@v4
        with:
          name: dharana-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14